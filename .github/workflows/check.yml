name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Documentation-only changes skip the checks and builds. Skipped jobs count as passed for the
  # required checks of main, so docs pull requests are not blocked.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or an unknown base: check everything.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$changed"
          docs='^(docs/|\.github/workflows/docs\.yml$|\.github/release-install\.md$|[^/]+\.md$|LICENSE$)'
          if printf '%s\n' "$changed" | grep -v '^$' | grep -qvE "$docs"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check-macos:
    name: Check macOS arm64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: brew install trunk
      - name: Run checks
        run: scripts/check.sh

  check-linux:
    name: Check Linux x86_64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The oldest Ubuntu LTS the release builds on, so that its packages are what the release is checked with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: .github/scripts/install-trunk-linux.sh
      - name: Run checks
        run: scripts/check.sh

  check-windows:
    name: Check Windows x86_64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, like the scripts expect.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: .github/scripts/install-trunk-windows.sh
      - name: Run checks
        run: scripts/check.sh

  # Every push to main and every pull request also gets an unsigned debug bundle to try out, kept
  # for two weeks under the run's artifacts. A debug build never updates itself and shares its data
  # with an installed Atrium.
  debug-build-macos:
    name: Debug build macOS ${{ matrix.arch }}
    needs: [check-macos, check-linux, check-windows]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-${{ matrix.target }}
      - name: Install Trunk and the Tauri CLI
        run: |
          brew install trunk
          cargo install tauri-cli --version '^2' --locked
      - name: Build the debug bundle
        working-directory: app/src-tauri
        run: cargo tauri build --debug --target ${{ matrix.target }} --bundles app
      - name: Zip the bundle
        run: |
          mkdir dist
          # ditto keeps the bundle structure, modes and symbolic links.
          ditto -c -k --keepParent "target/${{ matrix.target }}/debug/bundle/macos/Atrium.app" \
            "dist/atrium-macos-${{ matrix.arch }}-debug.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-macos-${{ matrix.arch }}-debug-${{ github.sha }}
          path: dist/atrium-macos-${{ matrix.arch }}-debug.zip
          if-no-files-found: error
          retention-days: 14

  # The Linux debug build of every push to main and every pull request, as an AppImage and as the
  # plain binary (stripped, uses the system's WebKitGTK and GTK). It never updates itself.
  debug-build-linux:
    name: Debug build Linux ${{ matrix.arch }}
    needs: [check-macos, check-linux, check-windows]
    # Built natively for each architecture, on the same runners as the release.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          # Bundled into the AppImage for audio and video (tauri.linux.conf.json bundleMediaFramework).
          sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav patchelf file
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-${{ matrix.arch }}-unknown-linux-gnu
      - name: Install Trunk and the Tauri CLI
        run: |
          .github/scripts/install-trunk-linux.sh
          cargo install tauri-cli --version '=2.12.4' --locked
      - name: Build the debug AppImage
        working-directory: app/src-tauri
        run: cargo tauri build --debug --bundles appimage
      - name: Check and rename the AppImage and the binary
        run: |
          built_images=(target/debug/bundle/appimage/atrium_*.AppImage)
          scripts/check-appimage.sh "${built_images[@]}"
          mkdir dist
          mv "${built_images[0]}" dist/atrium-linux-${{ matrix.arch }}-debug.AppImage
          install -s -m 755 target/debug/atrium dist/atrium-linux-${{ matrix.arch }}-debug
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-linux-${{ matrix.arch }}-debug-${{ github.sha }}
          path: dist/atrium-linux-${{ matrix.arch }}-debug.AppImage
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-linux-${{ matrix.arch }}-debug-binary-${{ github.sha }}
          path: dist/atrium-linux-${{ matrix.arch }}-debug
          if-no-files-found: error
          retention-days: 14

  # The Windows debug build of every push to main and every pull request, as the bare executable.
  # It never updates itself.
  debug-build-windows:
    name: Debug build Windows x86_64
    needs: [check-macos, check-linux, check-windows]
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, like the scripts expect.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-x86_64-pc-windows-msvc
      - name: Install Trunk and the Tauri CLI
        run: |
          .github/scripts/install-trunk-windows.sh
          cargo install tauri-cli --version '=2.12.4' --locked
      - name: Build the debug executable
        working-directory: app/src-tauri
        run: cargo tauri build --debug --no-bundle
      - name: Rename the executable
        run: |
          mkdir dist
          mv target/debug/atrium.exe dist/atrium-windows-x86_64-debug.exe
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-windows-x86_64-debug-${{ github.sha }}
          path: dist/atrium-windows-x86_64-debug.exe
          if-no-files-found: error
          retention-days: 14
