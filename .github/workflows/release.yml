name: release

# Builds unsigned macOS bundles for Apple silicon and Intel, Linux AppImages for x86_64 and
# arm64 and a Windows installer on a version tag and publishes them as a GitHub Release with a SHA256SUMS
# file, which the in-app updater requires.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version lives only in the workspace Cargo.toml; tauri.conf.json inherits it.
      - name: Tag matches the Cargo version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "atrium") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo version ${version}"
            exit 1
          fi
          if jq -e 'has("version")' app/src-tauri/tauri.conf.json > /dev/null; then
            echo "::error::tauri.conf.json must not set its own version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Trunk and the Tauri CLI
        run: |
          brew install trunk
          cargo install tauri-cli --version '^2' --locked
      - name: Build the app bundle
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app
      - name: Check and zip the bundle
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Atrium.app"
          plist="$app/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          if [ "v${bundle_version}" != "${GITHUB_REF_NAME}" ] || [ "${bundle_id}" != "org.fuchss.atrium" ]; then
            echo "::error::Bundle ${bundle_id} ${bundle_version} does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          mkdir dist
          # ditto keeps the bundle structure, modes and symbolic links.
          ditto -c -k --keepParent "$app" "dist/atrium-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: atrium-macos-${{ matrix.arch }}
          path: dist/atrium-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-other:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The oldest supported runners, as an AppImage runs only on systems with this glibc or newer.
          - os: ubuntu-22.04
            name: linux-x86_64
            bundles: appimage
          - os: ubuntu-22.04-arm
            name: linux-arm64
            bundles: appimage
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: Build the bundles
        working-directory: app/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Collect the bundles
        shell: bash
        run: |
          mkdir dist
          bundle=target/release/bundle
          if [ "${{ runner.os }}" = Linux ]; then
            cp "$bundle"/appimage/*.AppImage "dist/atrium-${{ matrix.name }}.AppImage"
          else
            cp "$bundle"/nsis/*-setup.exe "dist/atrium-${{ matrix.name }}-setup.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: atrium-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum atrium-* > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/atrium-* dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Atrium ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
