name: release

# Builds unsigned macOS bundles for Apple silicon and Intel, Linux AppImages for x86_64 and aarch64 and a
# Windows x86_64 executable on a version tag and publishes them as a GitHub Release with a SHA256SUMS file, which the in-app
# updater requires.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version lives only in the workspace Cargo.toml; tauri.conf.json inherits it.
      - name: Tag matches the Cargo version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "atrium") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo version ${version}"
            exit 1
          fi
          if jq -e 'has("version")' app/src-tauri/tauri.conf.json > /dev/null; then
            echo "::error::tauri.conf.json must not set its own version"
            exit 1
          fi

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Trunk and the Tauri CLI
        run: |
          brew install trunk
          cargo install tauri-cli --version '=2.12.4' --locked
      - name: Build the app bundle
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app
      - name: Check and zip the bundle
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Atrium.app"
          plist="$app/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          if [ "v${bundle_version}" != "${GITHUB_REF_NAME}" ] || [ "${bundle_id}" != "org.fuchss.atrium" ]; then
            echo "::error::Bundle ${bundle_id} ${bundle_version} does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          mkdir dist
          # ditto keeps the bundle structure, modes and symbolic links.
          ditto -c -k --keepParent "$app" "dist/atrium-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-macos-${{ matrix.arch }}
          path: dist/atrium-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: version
    # The AppImage bundles the runner's WebKitGTK and GTK and needs at least the runner's glibc.
    # Both runners are pinned to the oldest Ubuntu release the AppImage supports (24.04), so that
    # ubuntu-latest moving to a newer release does not raise the glibc floor.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          # Bundled into the AppImage for audio and video (tauri.linux.conf.json bundleMediaFramework).
          sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav patchelf file
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Install Trunk and the Tauri CLI
        run: |
          .github/scripts/install-trunk-linux.sh
          cargo install tauri-cli --version '=2.12.4' --locked
      - name: Build the AppImage
        working-directory: app/src-tauri
        run: cargo tauri build --bundles appimage
      - name: Check and rename the AppImage
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "atrium") | .version')"
          built_images=(target/release/bundle/appimage/atrium_"${version}"_*.AppImage)
          scripts/check-appimage.sh "${built_images[@]}"
          mkdir dist
          mv "${built_images[0]}" "dist/atrium-linux-${{ matrix.arch }}.AppImage"
          chmod 755 "dist/atrium-linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-linux-${{ matrix.arch }}
          path: dist/atrium-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, like the scripts expect.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Install Trunk and the Tauri CLI
        run: |
          .github/scripts/install-trunk-windows.sh
          cargo install tauri-cli --version '=2.12.4' --locked
      # Only the executable: Atrium ships on Windows as one portable file that updates itself.
      - name: Build the executable
        working-directory: app/src-tauri
        run: cargo tauri build --no-bundle
      - name: Check and rename the executable
        run: |
          exe=target/release/atrium.exe
          product_version="$(powershell.exe -NoProfile -Command "(Get-Item '${exe}').VersionInfo.ProductVersion" | tr -d '\r')"
          if [ "v${product_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Executable version ${product_version} does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          mkdir dist
          mv "${exe}" dist/atrium-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: atrium-windows-x86_64
          path: dist/atrium-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum atrium-macos-*.zip atrium-linux-*.AppImage atrium-windows-*.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/atrium-macos-*.zip dist/atrium-linux-*.AppImage dist/atrium-windows-*.exe dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Atrium ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
