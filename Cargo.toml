[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/fs-util",
    "crates/domain",
    "crates/store-fs",
    "crates/webview-dialogs",
    "crates/host-tauri",
    "crates/updater",
    "app/src-tauri",
    "app/ui",
]
# app/ui is a wasm crate built by Trunk; keep it out of plain `cargo build/test`.
default-members = [
    "crates/protocol",
    "crates/fs-util",
    "crates/domain",
    "crates/store-fs",
    "crates/webview-dialogs",
    "crates/host-tauri",
    "crates/updater",
    "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/dfuchss/atrium"
authors = ["Dominik Fuchß"]
description = "A lightweight messenger aggregator for macOS, Linux and Windows, built with Rust and Tauri"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
fs-util = { path = "crates/fs-util" }
domain = { path = "crates/domain" }
store-fs = { path = "crates/store-fs" }
webview-dialogs = { path = "crates/webview-dialogs" }
host-tauri = { path = "crates/host-tauri" }
updater = { path = "crates/updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-build = "2.7"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tempfile = "3"

# Clean-code rules for every crate (each opts in with `lints.workspace = true`); thresholds
# live in clippy.toml. Run everything with scripts/check.sh.
[workspace.lints.rust]
# Denied, not forbidden: host-tauri expects it once, to edit the environment at start-up.
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
dead_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
# Allowed pedantic lints, with the reason:
# - application crates, not a published API: no `# Errors`/`# Panics` sections, no `#[must_use]` everywhere
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# - settings structs mirror independent user toggles
struct_excessive_bools = "allow"
# - zoom factors and bounds are compared as stored, never as computed results
float_cmp = "allow"
# - `assert!(x.is_empty())` reads better than comparing against a typed empty array
assert_is_empty = "allow"
