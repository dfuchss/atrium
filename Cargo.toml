[workspace]
resolver = "3"
members = ["crates/protocol", "crates/domain", "crates/store-fs", "crates/host-tauri", "app/src-tauri", "app/ui"]
# app/ui is a wasm crate built by Trunk; keep it out of plain `cargo build/test`.
default-members = ["crates/protocol", "crates/domain", "crates/store-fs", "crates/host-tauri", "app/src-tauri"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
domain = { path = "crates/domain" }
store-fs = { path = "crates/store-fs" }
host-tauri = { path = "crates/host-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-build = "2.7"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tempfile = "3"
