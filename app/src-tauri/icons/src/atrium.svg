<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.45" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="roof"><rect x="232" y="232" width="560" height="560" rx="70"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <!-- the roof, seen from above, sloping inwards to the open centre (compluvium) -->
  <g clip-path="url(#roof)">
    <polygon points="232,232 792,232 642,382 382,382" fill="#ffffff" fill-opacity="0.97"/>
    <polygon points="792,232 792,792 642,642 642,382" fill="#ffffff" fill-opacity="0.72"/>
    <polygon points="232,792 792,792 642,642 382,642" fill="#ffffff" fill-opacity="0.55"/>
    <polygon points="232,232 232,792 382,642 382,382" fill="#ffffff" fill-opacity="0.84"/>
  </g>
  <!-- light falling into the courtyard -->
  <rect x="382" y="382" width="260" height="260" rx="22" fill="url(#light)"/>
  <rect x="382" y="382" width="260" height="260" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"/>
</svg>
