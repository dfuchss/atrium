[package]
name = "atrium-ui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
protocol = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["serde"] }
web-sys = { version = "0.3", features = ["Window", "Document", "KeyboardEvent", "Location", "console", "HtmlInputElement", "HtmlSelectElement", "EventTarget", "HtmlElement", "FileReader", "File", "FileList", "Event", "PointerEvent", "MouseEvent", "Element", "DomRect", "HtmlCollection", "DragEvent"] }

[lints]
workspace = true
