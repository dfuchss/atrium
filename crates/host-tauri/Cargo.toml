[package]
name = "host-tauri"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
domain.workspace = true
fs-util.workspace = true
protocol.workspace = true
uuid.workspace = true
url.workspace = true
webview-dialogs.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-autostart = "2.7.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
zbus = "5"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
