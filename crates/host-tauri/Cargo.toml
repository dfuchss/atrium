[package]
name = "host-tauri"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
domain.workspace = true
protocol.workspace = true
uuid.workspace = true
url.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-autostart = "2.7.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
macos-dialogs.workspace = true

# The version Tauri's GTK backend uses, so the widget types are the same.
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
gtk = "0.18.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
