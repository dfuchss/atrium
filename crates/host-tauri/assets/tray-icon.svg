  <g stroke="#000" stroke-width="2.5" stroke-linecap="round">
    <line x1="9" y1="9" x2="14" y2="14"/>
    <line x1="35" y1="9" x2="30" y2="14"/>
    <line x1="9" y1="35" x2="14" y2="30"/>
    <line x1="35" y1="35" x2="30" y2="30"/>
  </g>
  <rect x="14" y="14" width="16" height="16" rx="2" fill="#000"/>
</svg>
