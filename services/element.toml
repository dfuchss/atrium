id = "element"
name = "Element"
color = "#0DBD8B"
url = "https://{team}/"
team_label = "Element web host"
team_default = "app.element.io"
user_agent = "safari"
internal_hosts = ["{team}", "*.element.io", "*.matrix.org"]
allow_media = true

# Element's single-instance session lock (SessionLock.ts). This app only ever has one Element page
# per account, so a lock found at page start is stale (app was quit without unloading the page).
clear_local_storage = ["react_sdk_session_lock_ping", "react_sdk_session_lock_owner", "react_sdk_session_lock_claimant"]

[unread]
# Element puts the notification count in brackets, e.g. "Element [3]" (to verify in spike S2)
title_regex = '\[(\d+)\]'
title_indirect_regex = '\*'
