id = "element"
name = "Element"
color = "#0DBD8B"
url = "https://{instance}/"
instance_label = "Element web host"
instance_default = "app.element.io"
user_agent = "webkit"
internal_hosts = ["{instance}", "*.element.io", "*.matrix.org"]
allow_media = true

# Element's single-instance session lock (SessionLock.ts). This app only ever has one Element page
# per account, so a lock found at page start is stale (app was quit without unloading the page).
clear_local_storage = ["react_sdk_session_lock_ping", "react_sdk_session_lock_owner", "react_sdk_session_lock_claimant"]

[unread]
# Element's own badge: the count on the first space button (Home) in the space panel, which counts
# messages while the title counts rooms. No value (panel not rendered yet) falls back to the title.
# With "Show all rooms in Home" off, Home counts only rooms outside any space. A Home count below
# the title's room count means Home is partial: then the badges of the top-level joined spaces
# (draggable items, so no meta spaces or invites) are added, and the result is at least the title
# count. Dots on those spaces count as indirect unread either way.
poll = """(() => {
  const home = document.querySelector('.mx_SpaceButton');
  if (!home) return;
  const badge = button => button?.querySelector('.mx_SpacePanel_notificationBadge');
  const count = b => parseInt(b?.textContent) || 0;
  const homeBadge = badge(home);
  const rooms = parseInt(document.title.match(/\\[(\\d+)\\]/)?.[1]) || 0;
  const partial = count(homeBadge) < rooms;
  let direct = count(homeBadge);
  let dot = !!homeBadge && !direct;
  for (const space of document.querySelectorAll('li.mx_SpaceItem[data-rbd-draggable-id]')) {
    const b = badge(space.querySelector('.mx_SpaceButton'));
    if (partial) direct += count(b);
    dot ||= !!b && !count(b);
  }
  if (partial) direct = Math.max(direct, rooms);
  return { direct, indirect: !direct && dot };
})()"""
# Fallback: the window title counts rooms, e.g. "Element [3]"
title_regex = '\[(\d+)\]'
title_indirect_regex = '\*'
