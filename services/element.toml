id = "element"
name = "Element"
color = "#0DBD8B"
url = "https://{instance}/"
instance_label = "Element web host"
instance_default = "app.element.io"
user_agent = "safari"
internal_hosts = ["{instance}", "*.element.io", "*.matrix.org"]
allow_media = true

# Element's single-instance session lock (SessionLock.ts). This app only ever has one Element page
# per account, so a lock found at page start is stale (app was quit without unloading the page).
clear_local_storage = ["react_sdk_session_lock_ping", "react_sdk_session_lock_owner", "react_sdk_session_lock_claimant"]

[unread]
# Element's own badge: the count on the first space button (Home) in the space panel, which counts
# messages while the title counts rooms. No value (panel not rendered yet) falls back to the title.
poll = """(s=>s&&(b=>({direct:parseInt(b?.textContent)||0,indirect:!!b&&!parseInt(b.textContent)}))(s.querySelector('.mx_SpacePanel_notificationBadge')))(document.querySelector('.mx_SpaceButton'))"""
# Fallback: the window title counts rooms, e.g. "Element [3]"
title_regex = '\[(\d+)\]'
title_indirect_regex = '\*'
